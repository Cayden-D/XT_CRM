<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>销途 CRM 使用教程</title>
<style>
:root {
  --navy:#102b3a; --navy-2:#173f52; --ink:#18313f; --muted:#6c7f88; --line:#dbe4e6; --teal:#12a594; --teal-d:#0d7c6e; --teal-pale:#e3f5f0;
  --gold:#d79628; --warn-bg:#fff4df; --warn:#93600e; --red:#c2410c; --bg:#edf2f3; --card:#ffffff;
  --font:"PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei",sans-serif; --mono:"SF Mono","Menlo","IBM Plex Mono",monospace;
}
* { box-sizing:border-box; }
html,body { margin:0; height:100%; background:#0b1d27; color:var(--ink); font-family:var(--font); overflow:hidden; }
body.render { background:#0b1d27; }
#viewport { position:absolute; inset:0 0 76px 0; display:grid; place-items:center; overflow:hidden; }
body.render #viewport { inset:0; }
#stage { position:relative; width:1920px; height:1080px; flex:none; overflow:hidden; transform-origin:center center;
  background:radial-gradient(1200px 700px at 78% 30%,#f6faf9 0%,#e8f0f1 55%,#dde8ea 100%); }
.scene { position:absolute; inset:0; display:none; }
/* chrome shared by all scenes */
.brand { position:absolute; left:64px; top:40px; display:flex; align-items:center; gap:14px; z-index:5; }
.brand i { width:40px; height:40px; border-radius:11px; background:var(--navy); display:grid; place-items:center; }
.brand i::after { content:""; width:16px; height:16px; border:3px solid #5fe0c9; border-radius:50%; border-right-color:transparent; transform:rotate(-30deg); }
.brand b { font-size:22px; color:var(--navy); letter-spacing:.02em; } .brand span { font-size:16px; color:var(--muted); margin-left:4px; }
#chapters { position:absolute; left:64px; right:64px; bottom:34px; display:flex; gap:8px; z-index:6; }
#chapters div { flex:1; }
#chapters div i { display:block; height:5px; border-radius:3px; background:rgba(16,43,58,.12); overflow:hidden; }
#chapters div i b { display:block; height:100%; width:0; background:var(--teal); }
#chapters div span { display:block; margin-top:9px; font-size:14px; color:#8a9aa0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
#chapters div.on span { color:var(--navy); font-weight:600; }
#sub { position:absolute; left:50%; bottom:78px; transform:translateX(-50%); max-width:1400px; padding:12px 30px; border-radius:14px; background:rgba(11,29,39,.86); color:#fff;
  font-size:34px; line-height:1.45; font-weight:500; text-align:center; letter-spacing:.02em; z-index:40; box-shadow:0 12px 30px rgba(0,0,0,.25); display:none; white-space:nowrap; }
body.nosubs #sub { display:none !important; }
#cursor { position:absolute; left:0; top:0; width:34px; height:34px; z-index:50; pointer-events:none; display:none; }
#cursor svg { filter:drop-shadow(0 4px 6px rgba(0,0,0,.28)); transform-origin:4px 4px; }
#ripple { position:absolute; width:70px; height:70px; margin:-35px 0 0 -35px; border-radius:50%; border:4px solid var(--teal); z-index:49; opacity:0; pointer-events:none; }

/* caption column */
.cap { position:absolute; left:64px; top:150px; width:560px; }
.cap .no { font:600 18px var(--mono); color:var(--teal-d); letter-spacing:.12em; }
.cap h2 { margin:14px 0 18px; font-size:58px; line-height:1.15; color:var(--navy); letter-spacing:.01em; }
.cap p.lead { margin:0 0 34px; font-size:24px; line-height:1.65; color:#4d636c; }
.cap ol { list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:14px; }
.cap li { display:flex; gap:16px; align-items:flex-start; padding:16px 18px; border-radius:16px; background:rgba(255,255,255,.55); border:1px solid rgba(16,43,58,.06); color:#6b7f87; font-size:22px; line-height:1.5; transition:none; }
.cap li em { flex:none; width:34px; height:34px; border-radius:50%; background:#dfe8ea; color:#6b7f87; font:600 17px var(--mono); font-style:normal; display:grid; place-items:center; margin-top:1px; }
.cap li.on { background:#fff; color:var(--ink); border-color:rgba(18,165,148,.35); box-shadow:0 10px 30px rgba(16,43,58,.08); }
.cap li.on em { background:var(--teal); color:#fff; }
.cap li.done em { background:var(--teal-pale); color:var(--teal-d); }

/* app window mock */
.win { position:absolute; left:680px; top:120px; width:1180px; height:840px; border-radius:22px; background:var(--bg); overflow:hidden;
  box-shadow:0 40px 90px rgba(16,43,58,.22),0 0 0 1px rgba(16,43,58,.06); }
.app { position:absolute; inset:0; display:flex; }
.side { width:210px; flex:none; background:var(--navy); color:#c9d8dc; padding:24px 14px; display:flex; flex-direction:column; gap:4px; }
.side .logo { display:flex; align-items:center; gap:10px; padding:0 8px 22px; color:#fff; font-weight:700; font-size:19px; }
.side .logo i { width:28px; height:28px; border-radius:8px; background:#1b766f; display:grid; place-items:center; }
.side .logo i::after { content:""; width:11px; height:11px; border:2.5px solid #8be3d7; border-radius:50%; border-right-color:transparent; }
.side .it { display:flex; align-items:center; gap:10px; height:38px; padding:0 12px; border-radius:10px; font-size:15px; color:#b4c7cc; }
.side .it svg { width:18px; height:18px; flex:none; }
.side .it.on { background:rgba(255,255,255,.1); color:#fff; box-shadow:inset 3px 0 0 #5fe0c9; }
.side .it.pulse { background:rgba(95,224,201,.22); color:#fff; }
.main { flex:1; min-width:0; display:flex; flex-direction:column; }
.top { height:78px; flex:none; display:flex; align-items:center; justify-content:space-between; padding:0 30px; background:#f8fafa; border-bottom:1px solid var(--line); }
.top small { display:block; color:#8a9aa0; font-size:12px; } .top b { font-size:24px; color:var(--navy); }
.top .ai { height:38px; padding:0 14px; border-radius:10px; border:1px solid #b9ddd7; background:var(--teal-pale); color:var(--teal-d); font-size:14px; font-weight:600; display:flex; align-items:center; gap:7px; }
.body { flex:1; min-height:0; padding:24px 28px; display:flex; flex-direction:column; gap:16px; position:relative; }
.row { display:flex; gap:14px; align-items:center; }
.chip { height:36px; padding:0 14px; border-radius:18px; border:1px solid var(--line); background:#fff; color:#55707a; font-size:14px; display:inline-flex; align-items:center; gap:8px; }
.chip span { min-width:22px; height:20px; padding:0 6px; border-radius:10px; background:#eef3f4; font:600 12px var(--mono); display:grid; place-items:center; }
.chip.on { background:var(--navy); border-color:var(--navy); color:#fff; } .chip.on span { background:rgba(255,255,255,.18); color:#fff; }
.btn { height:40px; padding:0 18px; border-radius:10px; background:var(--teal); color:#fff; font-size:15px; font-weight:600; display:inline-flex; align-items:center; gap:8px; box-shadow:0 6px 16px rgba(18,165,148,.25); }
.btn.ghost { background:#fff; color:var(--ink); border:1px solid var(--line); box-shadow:none; }
.search { flex:1; height:42px; border-radius:11px; border:1px solid var(--line); background:#fff; display:flex; align-items:center; gap:10px; padding:0 14px; color:#97a6ab; font-size:15px; }
.card { background:#fff; border:1px solid var(--line); border-radius:16px; }
.kpis { display:grid; grid-template-columns:repeat(3,1fr); gap:14px; }
.kpi { padding:18px 20px; } .kpi small { color:var(--muted); font-size:14px; } .kpi strong { display:block; margin:6px 0 6px; font:600 32px var(--mono); color:var(--navy); letter-spacing:-.02em; }
.kpi .d { font-size:13px; font-weight:600; } .up { color:#1f8a52; } .down { color:#b4412f; }
.bars { display:flex; align-items:flex-end; gap:12px; height:170px; padding:12px 18px 0; }
.bars i { flex:1; border-radius:6px 6px 0 0; background:linear-gradient(180deg,#2bb9a6,#12a594); transform-origin:bottom; }
.todo { display:flex; align-items:center; gap:14px; padding:14px 18px; border-bottom:1px solid #f0f3f4; font-size:16px; }
.todo:last-child { border-bottom:0; }
.todo b { margin-left:auto; font:600 20px var(--mono); color:var(--navy); } .todo .dot { width:10px; height:10px; border-radius:50%; }
.todo.hi { background:#f3fbf9; }
.grid4 { display:grid; grid-template-columns:repeat(4,1fr); gap:14px; }
.pc { overflow:hidden; } .compact .pc .im { aspect-ratio:4/3; } .compact .pc .im svg { width:42%; height:56%; } .pc .im { aspect-ratio:1/1; position:relative; display:grid; place-items:center; }
.pc .im svg { width:52%; height:52%; } .pc .tag { position:absolute; left:10px; top:10px; padding:3px 8px; border-radius:6px; background:rgba(16,43,58,.78); color:#fff; font-size:12px; }
.pc .st { position:absolute; right:10px; bottom:10px; padding:3px 9px; border-radius:10px; background:#fff; font-size:12px; font-weight:700; color:var(--teal-d); }
.pc .st.warn { background:var(--warn-bg); color:var(--warn); }
.pc .tx { padding:10px 12px 12px; } .pc .tt { font-size:14px; font-weight:600; line-height:1.45; height:40px; overflow:hidden; }
.pc .pr { margin-top:6px; display:flex; justify-content:space-between; align-items:baseline; } .pc .pr b { color:var(--red); font:600 16px var(--mono); } .pc .pr span { color:var(--muted); font-size:12px; }
.pc .sl { margin-top:5px; font-size:12px; color:#6b7f87; } .pc .sl b { color:var(--teal-d); }
table.t { width:100%; border-collapse:collapse; font-size:15px; }
table.t th { text-align:left; padding:12px 14px; color:#7d8f96; font-size:13px; font-weight:500; background:#f6f9f9; border-bottom:1px solid var(--line); }
table.t td { padding:13px 14px; border-bottom:1px solid #eef2f3; }
table.t tr.hi td { background:#f3fbf9; }
.pill { display:inline-block; padding:3px 10px; border-radius:11px; font-size:13px; font-weight:600; background:#eef3f4; color:#55707a; }
.pill.t { background:var(--teal-pale); color:var(--teal-d); } .pill.w { background:var(--warn-bg); color:var(--warn); } .pill.b { background:#e6f1fb; color:#1f5f93; } .pill.r { background:#fbe9e5; color:#a7412f; }
.mono { font-family:var(--mono); }
.bar { height:10px; border-radius:5px; background:#e8eff0; overflow:hidden; } .bar i { display:block; height:100%; border-radius:5px; background:var(--teal); transform-origin:left; }
.modal { position:absolute; inset:0; background:rgba(10,30,40,.38); display:grid; place-items:center; }
.dialog { width:620px; background:#fff; border-radius:18px; box-shadow:0 30px 70px rgba(0,0,0,.25); padding:26px 28px; }
.dialog h4 { margin:0 0 16px; font-size:22px; color:var(--navy); }
.field { margin-bottom:14px; } .field small { display:block; color:var(--muted); font-size:13px; margin-bottom:6px; }
.field div { min-height:46px; border:1px solid var(--line); border-radius:10px; padding:11px 14px; font-size:16px; line-height:1.5; }
.toast { position:absolute; left:50%; top:96px; transform:translateX(-50%); padding:12px 20px; border-radius:12px; background:var(--navy); color:#fff; font-size:16px; display:flex; gap:10px; align-items:center; box-shadow:0 14px 30px rgba(16,43,58,.3); z-index:10; }
.caret::after { content:""; display:inline-block; width:2px; height:1.1em; background:var(--teal); vertical-align:-3px; margin-left:2px; }

/* intro / outro */
.hero { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; }
.hero .mark { width:120px; height:120px; border-radius:32px; background:var(--navy); display:grid; place-items:center; box-shadow:0 30px 60px rgba(16,43,58,.3); }
.hero .mark::after { content:""; width:48px; height:48px; border:9px solid #5fe0c9; border-radius:50%; border-right-color:transparent; transform:rotate(-30deg); }
.hero h1 { margin:40px 0 18px; font-size:96px; color:var(--navy); letter-spacing:.02em; }
.hero p { margin:0; font-size:32px; color:#4d636c; }
.mods { margin-top:56px; display:flex; flex-wrap:wrap; justify-content:center; gap:16px; width:1300px; }
.mods span { padding:14px 24px; border-radius:30px; background:#fff; border:1px solid var(--line); font-size:24px; color:var(--ink); box-shadow:0 8px 20px rgba(16,43,58,.06); display:flex; gap:10px; align-items:center; }
.mods span svg { width:24px; height:24px; color:var(--teal-d); }
.overview { position:absolute; left:250px; right:28px; top:100px; display:grid; grid-template-columns:repeat(2,1fr); gap:14px; }
.ov { padding:16px 18px; display:flex; gap:14px; align-items:flex-start; }
.ov i { width:44px; height:44px; flex:none; border-radius:12px; background:var(--teal-pale); color:var(--teal-d); display:grid; place-items:center; }
.ov i svg { width:22px; height:22px; } .ov b { display:block; font-size:18px; color:var(--navy); margin-bottom:4px; } .ov span { font-size:14px; color:var(--muted); line-height:1.5; }
.pipe { display:flex; align-items:center; gap:0; padding:26px 22px; }
.node { width:150px; text-align:center; } .node i { width:64px; height:64px; margin:0 auto 10px; border-radius:18px; background:#eef3f4; color:#7d8f96; display:grid; place-items:center; }
.node i svg { width:30px; height:30px; } .node b { font-size:15px; color:var(--ink); } .node small { display:block; color:var(--muted); font-size:12px; margin-top:3px; }
.node.on i { background:var(--teal); color:#fff; box-shadow:0 10px 24px rgba(18,165,148,.35); }
.link { flex:1; height:4px; border-radius:2px; background:#e3eaeb; margin-top:-46px; overflow:hidden; } .link i { display:block; height:100%; background:var(--teal); transform-origin:left; }
.aipanel { position:absolute; right:0; top:0; bottom:0; width:430px; background:#f8faf9; border-left:1px solid #cedbdd; box-shadow:-14px 0 34px rgba(21,51,61,.12); display:flex; flex-direction:column; }
.aipanel .h { height:78px; background:#113440; color:#fff; display:flex; align-items:center; gap:12px; padding:0 20px; }
.aipanel .h i { width:38px; height:38px; border-radius:10px; background:#1b766f; display:grid; place-items:center; color:#8be3d7; } .aipanel .h i svg { width:20px; height:20px; }
.aipanel .h small { display:block; color:#88a6ae; font-size:12px; }
.aipanel .ctx { padding:10px 20px; font-size:13px; color:#85949a; border-bottom:1px solid var(--line); }
.aipanel .chat { flex:1; padding:18px; display:flex; flex-direction:column; gap:12px; overflow:hidden; }
.msg { max-width:88%; padding:12px 14px; border-radius:14px; font-size:15px; line-height:1.6; }
.msg.u { align-self:flex-end; background:#def2ee; border:1px solid #b9ddd7; border-radius:14px 4px 14px 14px; }
.msg.a { align-self:flex-start; background:#fff; border:1px solid #dbe5e6; border-radius:4px 14px 14px 14px; }
.msg.a ol { margin:6px 0 0; padding-left:20px; } .msg.a li { margin:3px 0; }
.tools { font-size:12px; color:#3f8f84; display:flex; gap:6px; align-items:center; }
.confirm { border:1px solid #b9ddd7; background:#f3fbf9; border-radius:12px; padding:12px; margin-top:4px; }
.confirm b { font-size:14px; color:#1d6f65; } .confirm p { margin:6px 0; font-size:14px; }
.confirm .bt { display:flex; gap:8px; } .confirm .bt span { height:30px; padding:0 12px; border-radius:8px; border:1px solid #cbdadb; background:#fff; font-size:13px; display:inline-flex; align-items:center; }
.confirm .bt span.ok { background:#128f81; border-color:#128f81; color:#fff; }
.dots { display:flex; gap:5px; } .dots i { width:8px; height:8px; border-radius:50%; background:#9cc9c3; }
.meter { height:14px; border-radius:7px; background:#e8eff0; overflow:hidden; } .meter i { display:block; height:100%; background:linear-gradient(90deg,#12a594,#2bb9a6); transform-origin:left; }
.recap { position:absolute; left:50%; top:450px; transform:translateX(-50%); width:1420px; display:grid; grid-template-columns:repeat(4,1fr); gap:18px; }
.recap div { padding:24px; border-radius:20px; background:#fff; border:1px solid var(--line); box-shadow:0 12px 26px rgba(16,43,58,.06); }
.recap b { display:block; font-size:24px; color:var(--navy); margin-bottom:8px; } .recap span { font-size:18px; color:var(--muted); line-height:1.6; }

/* player controls (not rendered into the video) */
#controls { position:absolute; left:0; right:0; bottom:0; height:76px; background:#0f2531; display:flex; align-items:center; gap:16px; padding:0 22px; color:#cfe0e4; font-size:14px; }
body.render #controls { display:none; }
#controls button { height:40px; min-width:40px; padding:0 14px; border:0; border-radius:10px; background:#1d3d4c; color:#fff; font:inherit; cursor:pointer; }
#controls button:hover { background:#25505f; }
#scrub { flex:1; accent-color:#12a594; }
#time { font-family:var(--mono); min-width:110px; text-align:right; }
#chapterSel { height:40px; border-radius:10px; background:#1d3d4c; color:#fff; border:0; padding:0 10px; font:inherit; }
@media (prefers-reduced-motion:reduce) { /* playback is user-started; nothing autoplays */ }
</style>
</head>
<body>
<div id="viewport"><div id="stage">
  <div class="brand"><i></i><b>销途 AI CRM</b><span>使用教程</span></div>
  <div id="chapters"></div>
  <div id="ripple"></div>
  <div id="sub" aria-live="polite"></div>
  <div id="cursor"><svg viewBox="0 0 24 24" width="34" height="34"><path d="M4 2 L4 20 L9 15.5 L12.5 22.5 L15.5 21 L12 14 L19 14 Z" fill="#fff" stroke="#102b3a" stroke-width="1.6" stroke-linejoin="round"/></svg></div>
</div></div>
<div id="controls">
  <button id="play" aria-label="播放">▶ 播放</button>
  <input id="scrub" type="range" min="0" max="1000" value="0" aria-label="进度">
  <span id="time">0:00 / 0:00</span>
  <select id="chapterSel" aria-label="章节"></select>
  <button id="subs" aria-pressed="true">字幕：开</button>
  <button id="full" aria-label="全屏">全屏</button>
</div>
<script>
'use strict'
/* ───────────── icons ───────────── */
const P = {
  grid:'<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>',
  users:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.6 3.4-5.5 6.5-5.5s5.7 1.9 6.5 5.5"/><path d="M16 4.6a3.4 3.4 0 0 1 0 6.6M18.5 14.8c1.6.8 2.7 2.5 3 5.2"/>',
  user:'<circle cx="12" cy="8" r="4"/><path d="M4 21c1-4.2 4.1-6.5 8-6.5s7 2.3 8 6.5"/>',
  box:'<path d="M21 8 12 3 3 8v8l9 5 9-5z"/><path d="m3 8 9 5 9-5M12 13v8"/>',
  db:'<ellipse cx="12" cy="5.5" rx="8" ry="3"/><path d="M4 5.5v13c0 1.7 3.6 3 8 3s8-1.3 8-3v-13M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/>',
  store:'<path d="M3.5 9 5 4h14l1.5 5"/><path d="M4.5 9v11h15V9"/><path d="M3.5 9h17M9.5 20v-6h5v6"/>',
  queue:'<path d="M4 6h16M4 12h16M4 18h10"/><path d="m17 16 3 2-3 2"/>',
  headset:'<path d="M4 14v-2a8 8 0 0 1 16 0v2"/><rect x="3" y="14" width="4" height="6" rx="1.5"/><rect x="17" y="14" width="4" height="6" rx="1.5"/>',
  gear:'<circle cx="12" cy="12" r="3.2"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"/>',
  spark:'<path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"/><path d="M19 3v4M17 5h4"/>',
  search:'<circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/>',
  refresh:'<path d="M20 11a8 8 0 0 0-14.5-4.6L4 8"/><path d="M4 3v5h5"/><path d="M4 13a8 8 0 0 0 14.5 4.6L20 16"/><path d="M20 21v-5h-5"/>',
  check:'<path d="m5 12.5 4.5 4.5L19 7"/>',
  alert:'<path d="M12 3 2.5 20h19z"/><path d="M12 10v4.5M12 17.5v.5"/>',
  eye:'<path d="M2 12s3.6-6.5 10-6.5S22 12 22 12s-3.6 6.5-10 6.5S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',
  tag:'<path d="M3 12V4h8l10 10-8 8z"/><circle cx="7.5" cy="8.5" r="1.4"/>',
  send:'<path d="M3 11.5 21 3l-8.5 18-2.2-7.3z"/>',
  link:'<path d="M10 14a4 4 0 0 0 5.7 0l3.6-3.6a4 4 0 0 0-5.7-5.7L12 6.3"/><path d="M14 10a4 4 0 0 0-5.7 0l-3.6 3.6a4 4 0 0 0 5.7 5.7l1.6-1.6"/>',

/* ───────────── timeline engine ───────────── */
const W = 1920, H = 1080, FADE = 450
const ease = { lin: t => t, out: t => 1 - Math.pow(1 - t, 3), inOut: t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2, back: t => { const c = 1.7; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2) } }
const stage = document.getElementById('stage'), cursorEl = document.getElementById('cursor'), rippleEl = document.getElementById('ripple')
const scenes = []
function scene(id, title, dur, build) { scenes.push({ id, title, dur, build }) }

function api(s) {
  const tracks = new Map(), counters = [], flags = [], texts = [], typers = [], hooks = []
  const el = (tag, cls = '', html = '', parent = s.root) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html) e.innerHTML = html; parent.appendChild(e); return e }
  const anim = (e, t0, d, from, to, fn = 'out') => { if (!tracks.has(e)) tracks.set(e, []); tracks.get(e).push({ t0, d, from, to, fn }) }
  const show = (e, t0, d = 500, dy = 24) => anim(e, t0, d, { o: 0, y: dy }, { o: 1, y: 0 })
  const pop = (e, t0, d = 450) => anim(e, t0, d, { o: 0, s: .85 }, { o: 1, s: 1 }, 'back')
  const hide = (e, t0, d = 350) => anim(e, t0, d, { o: 1 }, { o: 0 })
  const count = (e, t0, d, from, to, fmt = v => Math.round(v).toLocaleString('zh-CN')) => counters.push({ e, t0, d, from, to, fmt })
  const flag = (e, t0, cls, t1 = Infinity) => flags.push({ e, t0, t1, cls })
  const text = (e, steps) => texts.push({ e, steps })
  const type = (e, t0, str, cps = 16) => typers.push({ e, t0, str, cps })
  const hook = fn => hooks.push(fn)
  const cursor = pts => { s.cursor = pts }
  const caption = ({ no, title, lead, steps }) => {
    const c = el('div', 'cap')
    el('div', 'no', no, c); const h = el('h2', '', title, c); const p = el('p', 'lead', lead, c)
    show(c.querySelector('.no'), 150); show(h, 250); show(p, 420)
    const ol = el('ol', '', '', c)
    steps.forEach(([t, txt, tEnd], i) => {
      const li = el('li', '', `<em>${i + 1}</em><span>${txt}</span>`, ol)
      show(li, 650 + i * 160, 450, 16)
      const next = steps[i + 1]?.[0] ?? Infinity
      flag(li, t, 'on', tEnd ?? next); flag(li, tEnd ?? next, 'done')
    })
    return c
  }
  const app = ({ active, title, sub, ai = true }) => {
    const w = el('div', 'win'); const a = el('div', 'app', '', w)
    const side = el('div', 'side', '<div class="logo"><i></i>销途 AI CRM</div>', a)
    const items = {}
    for (const [k, icon] of [['经营看板', 'grid'], ['客户经营', 'users'], ['客户', 'user'], ['产品目录', 'box'], ['1688 商品采集', 'db'], ['图片编辑', 'wand'], ['电商套图', 'images'], ['1688 店铺', 'store'], ['上架队列', 'queue'], ['订单', 'receipt'], ['聊天与询盘', 'chats'], ['客服绩效', 'headset'], ['账户管理', 'userplus'], ['系统设置', 'gear']])
      items[k] = el('div', `it ${k === active ? 'on' : ''}`, `${ic(icon)}<span>${k}</span>`, side)
    const m = el('div', 'main', '', a)
    el('div', 'top', `<div><small>${sub || ''}</small><b>${title}</b></div>${ai ? `<div class="ai">${ic('spark', 16)}问 AI</div>` : ''}`, m)
    const body = el('div', 'body', '', m)
    show(w, 200, 650, 40)
    return { win: w, body, items, main: m }
  }
  return { el, anim, show, pop, hide, count, flag, text, type, hook, cursor, caption, app, tracks, counters, flags, texts, typers, hooks }
}

const DEF = { o: 1, x: 0, y: 0, s: 1 }
function applyTracks(tracks, lt) {
  for (const [e, list] of tracks) {
    const v = { ...DEF }; const seen = {}
    for (const tr of list) for (const k of Object.keys(tr.from)) if (!(k in seen)) { seen[k] = 1; v[k] = tr.from[k] }
    for (const tr of list) {
      if (lt < tr.t0) continue
      const p = tr.d ? Math.min(1, (lt - tr.t0) / tr.d) : 1, q = ease[tr.fn](p)
      for (const k of Object.keys(tr.to)) v[k] = tr.from[k] + (tr.to[k] - tr.from[k]) * q
    }
    e.style.opacity = v.o
    const tf = []
    if (v.x || v.y) tf.push(`translate(${v.x}px,${v.y}px)`)
    if (v.s !== 1) tf.push(`scale(${v.s})`)
    if ('sx' in v) tf.push(`scaleX(${v.sx})`)
    if ('sy' in v) tf.push(`scaleY(${v.sy})`)
    e.style.transform = tf.join(' ')
  }
}

function build() {
  let at = 0
  const chapters = document.getElementById('chapters'), sel = document.getElementById('chapterSel')
  for (const s of scenes) {
    s.start = at; at += s.dur
    s.root = document.createElement('div'); s.root.className = 'scene'; stage.insertBefore(s.root, chapters)
    s.api = api(s); s.build(s.api)
    if (s.title) {
      const c = document.createElement('div'); c.innerHTML = `<i><b></b></i><span>${s.title}</span>`; chapters.appendChild(c); s.chip = c
      const o = document.createElement('option'); o.value = s.start; o.textContent = s.title; sel.appendChild(o)
    }
  }
  return at
}

function seek(t) {
  let cur = null
  for (const s of scenes) {
    const lt = t - s.start, on = lt >= 0 && lt < s.dur
    s.root.style.display = on ? 'block' : 'none'
    if (s.chip) { const p = Math.max(0, Math.min(1, lt / s.dur)); s.chip.querySelector('b').style.width = `${p * 100}%`; s.chip.classList.toggle('on', on) }
    if (!on) continue
    cur = s
    const first = s === scenes[0], last = s === scenes[scenes.length - 1]
    s.root.style.opacity = Math.min(first ? 1 : Math.min(1, lt / FADE), last ? 1 : Math.min(1, (s.dur - lt) / FADE))
    const A = s.api
    applyTracks(A.tracks, lt)
    for (const c of A.counters) { const p = Math.max(0, Math.min(1, (lt - c.t0) / c.d)); c.e.textContent = c.fmt(c.from + (c.to - c.from) * ease.out(p)) }
    for (const f of A.flags) f.e.classList.toggle(f.cls, lt >= f.t0 && lt < f.t1)
    for (const x of A.texts) { let v = x.steps[0][1]; for (const [t0, s2] of x.steps) if (lt >= t0) v = s2; if (x.e.innerHTML !== v) x.e.innerHTML = v }
    for (const y of A.typers) { const n = Math.max(0, Math.min(y.str.length, Math.floor((lt - y.t0) / 1000 * y.cps))); const typing = lt >= y.t0 && n < y.str.length; y.e.textContent = y.str.slice(0, n); y.e.classList.toggle('caret', typing) }
    for (const h of A.hooks) h(lt)
    drawCursor(s, lt)
  }
  if (!cur) { cursorEl.style.display = 'none'; rippleEl.style.opacity = 0 }
}

function drawCursor(s, lt) {
  const pts = s.cursor
  if (!pts || lt < pts[0][0] - 400 || lt > pts[pts.length - 1][0] + 700) { cursorEl.style.display = 'none'; rippleEl.style.opacity = 0; return }
  cursorEl.style.display = 'block'
  let x = pts[0][1], y = pts[0][2]
  for (let i = 0; i < pts.length - 1; i++) {
    const [t0, x0, y0] = pts[i], [t1, x1, y1] = pts[i + 1]
    if (lt >= t1) { x = x1; y = y1; continue }
    if (lt >= t0) { const q = ease.inOut((lt - t0) / (t1 - t0)); x = x0 + (x1 - x0) * q; y = y0 + (y1 - y0) * q }
    break
  }
  cursorEl.style.opacity = Math.min(1, (lt - (pts[0][0] - 400)) / 300)
  let press = 1, rip = null
  for (const p of pts) if (p[3]) { const d = lt - p[0]; if (d >= 0 && d < 160) press = .82; if (d >= 0 && d < 520) rip = [p[1], p[2], d / 520] }
  cursorEl.style.transform = `translate(${x - 6}px,${y - 4}px) scale(${press})`
  if (rip) { rippleEl.style.left = `${rip[0]}px`; rippleEl.style.top = `${rip[1]}px`; rippleEl.style.opacity = 1 - rip[2]; rippleEl.style.transform = `scale(${.3 + rip[2] * .9})` } else rippleEl.style.opacity = 0
}

/* ───────────── player ───────────── */
const TOTAL = build()
// Absolute subtitle cues (ms), used by the player, the burned-in render and the SRT export.
const SUBS = scenes.flatMap(s => (NARRATION[s.id] || []).map(([a, b, text]) => ({ start: s.start + Math.round(a * 1000), end: s.start + Math.round(b * 1000), text })))
const subEl = document.getElementById('sub')
function drawSub(t) { const cue = SUBS.find(c => t >= c.start && t < c.end); subEl.style.display = cue ? 'block' : 'none'; if (cue && subEl.textContent !== cue.text) subEl.textContent = cue.text }
const render = new URLSearchParams(location.search).has('render')
if (render) document.body.classList.add('render')
// The plain render keeps the picture clean for a separate SRT; ?render=1&subs=1 burns the subtitles in.
const params = new URLSearchParams(location.search)
if (render && !params.has('subs')) document.body.classList.add('nosubs')
const subsBtn = document.getElementById('subs')
subsBtn.onclick = () => { const off = document.body.classList.toggle('nosubs'); subsBtn.textContent = off ? '字幕：关' : '字幕：开'; subsBtn.setAttribute('aria-pressed', String(!off)) }
const fmt = ms => { const s = Math.floor(ms / 1000); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}` }
let now = 0, playing = false, last = 0
const scrub = document.getElementById('scrub'), timeEl = document.getElementById('time'), playBtn = document.getElementById('play'), sel = document.getElementById('chapterSel')
function go(t) {
  now = Math.max(0, Math.min(TOTAL - 1, t)); seek(now); drawSub(now)
  scrub.value = Math.round(now / TOTAL * 1000); timeEl.textContent = `${fmt(now)} / ${fmt(TOTAL)}`
  let cur = ''; for (const s of scenes) if (s.title && now >= s.start) cur = String(s.start); if (cur) sel.value = cur
}
function loop(ts) { if (!playing) return; now += ts - last; last = ts; if (now >= TOTAL - 1) { playing = false; playBtn.textContent = '↺ 重播' } go(now); if (playing) requestAnimationFrame(loop) }
function toggle() { if (now >= TOTAL - 1) now = 0; playing = !playing; playBtn.textContent = playing ? '❚❚ 暂停' : '▶ 播放'; if (playing) { last = performance.now(); requestAnimationFrame(loop) } }
playBtn.onclick = toggle
scrub.oninput = () => go(scrub.value / 1000 * TOTAL)
sel.onchange = () => go(Number(sel.value) + 1)
document.getElementById('full').onclick = () => document.documentElement.requestFullscreen?.()
addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); toggle() } if (e.code === 'ArrowRight') go(now + 5000); if (e.code === 'ArrowLeft') go(now - 5000) })
function fit() { const v = document.getElementById('viewport'); const k = render ? 1 : Math.min(v.clientWidth / W, v.clientHeight / H); stage.style.transform = `scale(${k})` }
addEventListener('resize', fit); fit(); go(0)
// Frame-exact rendering hook used by render-tutorial.mjs.
window.__tutorial = { duration: TOTAL, seek: t => { go(t); return document.fonts.ready.then(() => true) }, chapters: scenes.filter(s => s.title).map(s => ({ title: s.title, start: s.start })), subtitles: SUBS }
</script>
